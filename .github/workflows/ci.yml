name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out evaluated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check change whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "${HEAD_SHA}^{commit}"

          case "$EVENT_NAME" in
            pull_request)
              git cat-file -e "${BASE_SHA}^{commit}"
              git diff --check "${BASE_SHA}...${HEAD_SHA}" --
              ;;
            push)
              if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                empty_tree=$(git hash-object -t tree --stdin </dev/null)
                git diff --check "$empty_tree" "$HEAD_SHA" --
              else
                git cat-file -e "${BASE_SHA}^{commit}"
                git diff --check "$BASE_SHA" "$HEAD_SHA" --
              fi
              ;;
            *)
              printf 'Unsupported event\n' >&2
              exit 1
              ;;
          esac

      - name: Reject prohibited tracked artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import sys
          from pathlib import PurePosixPath

          tracked = subprocess.check_output(["git", "ls-files", "-z"])
          prohibited = []

          for raw_path in tracked.split(b"\0"):
              if not raw_path:
                  continue
              path = raw_path.decode("utf-8", errors="surrogateescape")
              parts = PurePosixPath(path).parts
              name = parts[-1]
              forbidden = (
                  name == "project_state.md"
                  or any(part in {"venv", ".venv", "__pycache__"} for part in parts)
                  or name.endswith((".pyc", ".pyo"))
                  or (
                      (name == ".env" or name.startswith(".env."))
                      and name != ".env.example"
                  )
              )
              if forbidden:
                  prohibited.append(path)

          if prohibited:
              for path in prohibited:
                  print(f"Prohibited tracked artifact: {path!r}", file=sys.stderr)
              sys.exit(1)

          print("Tracked artifact check passed")
          PY

  policy-validation:
    name: policy-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out evaluated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare isolated validation environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m venv "$RUNNER_TEMP/policy-venv"
          "$RUNNER_TEMP/policy-venv/bin/python" -m pip --isolated install \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            -r requirements.txt \
            -r requirements-dev.txt
          "$RUNNER_TEMP/policy-venv/bin/python" -m pip check

      - name: Check lint and formatting
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/policy-venv/bin/python" -m ruff check --no-cache src tests
          "$RUNNER_TEMP/policy-venv/bin/python" -m ruff format \
            --no-cache --check src tests

      - name: Check strict types
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/policy-venv/bin/python" -m mypy \
            --cache-dir "$RUNNER_TEMP/policy-mypy-cache"

      - name: Prepare isolated PostgreSQL image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 \
            docker.io/library/postgres@sha256:885953109528ad3dfc90362b1a6f50a78620b5315be19f187753d267e484dc5b

      - name: Test policy and PostgreSQL acceptance
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/policy-venv/bin/python" \
            tests/support/run_postgresql_acceptance.py
